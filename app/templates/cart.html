<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cart - ShopLite</title>
  <script src="http://code.jquery.com/jquery-1.6.1.min.js"></script>
</head>
<body>
  <h1>Cart</h1>
  <div id="content">{{ content | safe }}</div>
  <div id="out"></div>
  <script>
    var q = "{{ request.args.get('q', '') }}";
    document.getElementById("out").innerHTML = q;     // DOM XSS sink
    eval("var page = 'cart'");
  </script>
  <form method="post" action="/cart">             <!-- no CSRF token -->
    <input name="csrf" value="">
  </form>
</body>
</html>
