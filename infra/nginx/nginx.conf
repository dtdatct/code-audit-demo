worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens on;

    server {
        listen 80;
        server_name shoplite.example.com;

        location / {
            proxy_pass http://web:5000;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        }

        location /static/ {
            alias /srv/uploads/;
            autoindex on;
        }

        location /admin {
            proxy_pass http://web:5000/admin;
            # no allow/deny: admin is reachable from the internet
        }
    }
}
